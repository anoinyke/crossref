[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anoinyke-crossref"
version = "0.1.0"
description = "从输入中抽取数值，计算多模态引用的图文对应相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "anoinyke" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://anoinyke.github.io"
Repository = "https://github.com/anoinyke/crossref"
Issues = "https://github.com/anoinyke/crossref/issues"

[project.scripts]
crossref = "crossref:main"

[tool.setuptools]
py-modules = ["crossref"]
